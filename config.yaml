# ==============================================================================
# MuMu 模拟器运动模拟器 (MuMuRealRun) 配置文件
# ==============================================================================

# 模拟器设置
mumu:
  # 模拟器安装路径。
  # 留空 "" 时程序会自动通过注册表、运行进程、系统环境变量、全盘常见路径自适应探测。
  # 若自动探测未识别，可手动指定（例如："D:\\Games\\MuMu Player 12"）
  path: ""

  # 模拟器多开编号，单开通常为 0
  vm_index: 0

  # 如果检测到目标模拟器尚未启动，是否自动调起启动
  auto_launch: true

  # 驱动后端:
  # - "mumu_manager": 推荐。通过 MuMuManager 底层接口注入坐标，底层硬件级模拟，App 无法检测模拟定位开关。
  # - "adb": 通过 ADB 调试接口与模拟器交互。
  backend: "mumu_manager"

# 跑步与运动轨迹仿真配置
run:
  # 路线文件路径（支持相对路径与绝对路径）
  # 默认使用项目根目录下的 ZJGroute.txt（浙大紫金港操场跑道）
  route_file: "ZJGroute.txt"

  # 输入路线的坐标系类型:
  # - "gcj02": 火星坐标系（高德开放平台、腾讯地图、大多数国内APP导出的坐标）
  # - "wgs84": 国际标准 GPS 坐标（如 OpenStreetMap、国外测绘仪）
  # - "bd09": 百度地图坐标系
  # 说明：安卓系统底层 GPS 驱动以 WGS-84 为标准，如果输入为 gcj02，程序将自动转换为 WGS-84 后注入模拟器，
  # 这样进入运动 App（如咪咕跑、阳光体育等）后经过高德 SDK 内部转换恰好完美契合实际道路/跑道。
  coord_type: "gcj02"

  # 目标跑步速度（米/秒）
  # 参考换算:
  # 2.8 m/s ≈ 10.0 km/h (配速 6'00"/km，轻松慢跑)
  # 3.2 m/s ≈ 11.5 km/h (配速 5'13"/km，中速跑)
  # 3.5 m/s ≈ 12.6 km/h (配速 4'45"/km，快速跑)
  speed_mps: 3.2

  # 拟真随机速度波动比例 (0.0 ~ 0.3)
  # 0.10 表示瞬时速度在目标速度 ±10% 范围内平滑微调，避免机械式绝对匀速被判定异常
  speed_jitter_pct: 0.10

  # GPS 微弱随机飘移扰动（米）
  # 0.8 表示模拟正常手机在户外接收 GPS 信号时 ±0.8 米的真实自然微弱横向漂移
  gps_jitter_meters: 0.8

  # 弯道自动减速（模拟人体转弯时的自然降速）
  slow_down_on_turns: true

  # 定位刷新频率间隔（秒），推荐 1.0 秒
  interval_sec: 1.0

# 运动目标限制（默认无限循环奔跑，直到按 Q 或 Ctrl+C 停止）
target:
  # 目标总跑步里程（米）。例如 2500 表示 2.5公里。设为 0 表示不限制距离
  distance_meters: 0

  # 目标圈数（以路线为闭环）。设为 0 表示不按圈数限制
  laps: 0

  # 是否无限循环奔跑（默认 true，达成距离/圈数后忽略或持续奔跑，直到手动按 Q 或 Ctrl+C 退出）
  infinite_loop: true

# ADB 与应用辅助控制（可选）
adb:
  # 是否在启动时自动连接 ADB
  auto_connect: true
  # 目标 App 包名（可选，如果填写，运行状态栏会显示该 App 是否处于前台）
  # 例如: "com.example.app"
  target_package: ""
